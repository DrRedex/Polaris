[project]
name = "making-sense-of-logs"
version = "0.1.0"
description = "Role-specific log insights over SereneDB via an MCP server"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.3.0",
    "openai>=1.60.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "streamlit>=1.45.0",
    "pandas>=2.0.0",
    # Semantic schema grounding (src/semantic_layer.py) and guarded SQL (src/guarded_sql_agent.py)
    "numpy>=1.26.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.5.0",
    "sqlglot>=25.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "duckdb>=1.1.0",
]

[tool.uv]
package = false

# CPU-only PyTorch: the default Linux wheel bundles CUDA (~2.5 GB) that the embedding model does not need.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
