[project]
name = "making-sense-of-logs"
version = "0.1.0"
description = "Role-specific log insights over SereneDB via an MCP server"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.3.0",
    "openai>=1.60.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "streamlit>=1.45.0",
    "pandas>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "duckdb>=1.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
